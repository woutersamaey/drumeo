; Pool overrides for the frontend. Loaded last (zz-), after the image's
; www.conf, docker.conf and zz-docker.conf, so these values win.
[www]
; Root because the container runs as 0:0 (CMD uses php-fpm -R) and writes the
; root-owned image-cache volume.
user = root
group = root
listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Matches nginx's longest fastcgi_read_timeout (/app/admin/: 300 s). The admin
; overview and cleanup wait on the video API for minutes.
request_terminate_timeout = 300

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
