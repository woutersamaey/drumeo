; php-fpm pool for video-api. Installed as /usr/local/etc/php-fpm.d/zz-root.conf,
; after the image's www.conf and zz-docker.conf, so these values win.
; Runs as root (compose sets user "0:0"; NAS files are often mode 700);
; the entrypoint starts php-fpm with -R to allow that.
[www]
user = root
group = root
listen = 9000
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
; Matches nginx fastcgi_read_timeout; ffprobe has its own shorter timeout.
request_terminate_timeout = 300
clear_env = no
catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
