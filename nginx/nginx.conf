worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 8m;
    gzip on;
    gzip_types application/vnd.apple.mpegurl application/x-mpegURL text/plain application/json text/css application/javascript;

    map $uri $hls_cache {
        default "public, max-age=86400";
        "~*\.m3u8$" "no-cache";
    }

    server {
        listen 80;
        server_name _;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location /assets/ {
            alias /var/www/frontend/assets/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        location ^~ /img/ {
            root /media/img-cache;
            try_files $uri @img_gen;
            expires 30d;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            types {
                image/webp webp;
                image/jpeg jpg jpeg;
            }
            default_type image/jpeg;
            access_log off;
        }

        location @img_gen {
            internal;
            include fastcgi_params;
            fastcgi_pass frontend:9000;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param DOCUMENT_ROOT /app/public;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_read_timeout 30s;
        }

        location /hls/ {
            alias /media/cache/;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            default_type application/octet-stream;
            gzip on;
            gzip_types application/vnd.apple.mpegurl application/x-mpegURL text/plain;
            add_header Access-Control-Allow-Origin * always;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control $hls_cache always;
        }

        location /api/ {
            include fastcgi_params;
            fastcgi_pass video-api:9000;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param DOCUMENT_ROOT /app/public;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;
        }

        location /app/ {
            include fastcgi_params;
            fastcgi_pass frontend:9000;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param DOCUMENT_ROOT /app/public;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_read_timeout 120s;
        }

        location / {
            include fastcgi_params;
            fastcgi_pass frontend:9000;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param DOCUMENT_ROOT /app/public;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_read_timeout 60s;
        }
    }
}
